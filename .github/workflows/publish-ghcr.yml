name: Publish TeamWack Images to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: teamwack-website
            context: .
            dockerfile: ./Dockerfile
          - image: teamwack-api
            context: ./server
            dockerfile: ./server/Dockerfile

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: AtomicBunny59
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/atomicbunny59/${{ matrix.image }}:latest
            ghcr.io/atomicbunny59/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BrunsmaC/TeamWack
