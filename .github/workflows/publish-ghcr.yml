
name: Publish Docker Images to GHCR

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: teamwack-website
            context: ./my-react-app
            dockerfile: ./my-react-app/Dockerfile
          - image: teamwack-api
            context: ./server
            dockerfile: ./server/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: AtomicBunny59
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/atomicbunny59/${{ matrix.image }}:latest
            ghcr.io/atomicbunny59/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BrunsmaC/TeamWack
